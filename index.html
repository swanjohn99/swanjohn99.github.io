<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Cleaning Dashboard</title>

     DEPLOYMENT URL — THE ONLY LINE YOU EVER NEED TO CHANGE
     Update this when you create a new GAS deployment.
     Never inject this from the server — hardcode it here.
     ═══════════════════════════════════════════════════════ -->
<script>
  // ── ONLY LINE TO CHANGE after a new GAS deployment ──
  window.DEPLOYMENT_URL = 'https://script.google.com/macros/s/AKfycbyBMSJT3WNWd-zu76nlcfSfIRaJ7-zI5-JtPnx2kPiLLTgo-mlzKTlIAk27JPjaGiG2/exec';
</script>

<style>
/* ── tokens ── */
:root {
  --bg:           #0f1117;
  --surface:      #181c27;
  --surface2:     #1f2436;
  --border:       #2a3050;
  --accent:       #3d8ef8;
  --accent-dim:   #1e4a8c;
  --danger:       #ff3b55;
  --danger-glow:  rgba(255,59,85,.35);
  --text-primary: #e8ecf4;
  --text-muted:   #6b7799;
  --text-dim:     #3d4a6b;
  --checkout-col: #f59e0b;
  --checkin-col:  #22d3a5;
  --radius:       10px;
  --radius-sm:    6px;
  --font-mono:    'JetBrains Mono','Fira Code','Courier New',monospace;
  --font-ui:      'DM Sans','Segoe UI',sans-serif;
}

/* ── reset ── */
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html,body { height:100%; background:var(--bg); color:var(--text-primary); font-family:var(--font-ui); }

/* ── app shell ── */
#app { display:flex; flex-direction:column; min-height:100%; }

/* ── header ── */
header {
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 20px 12px;
  border-bottom:1px solid var(--border);
  background:var(--surface);
  position:sticky; top:0; z-index:100;
}
.header-brand { display:flex; align-items:center; gap:10px; }
.header-title { font-size:15px; font-weight:600; letter-spacing:.02em; }
.header-sub   { font-size:11px; color:var(--text-muted); font-family:var(--font-mono); }
.header-meta  { text-align:right; }
.today-label  { font-size:12px; color:var(--text-muted); margin-bottom:2px; }
.today-date   { font-size:14px; font-weight:600; color:var(--accent); font-family:var(--font-mono); }

/* ── status bar ── */
#status-bar {
  display:flex; align-items:center; gap:10px;
  padding:10px 20px; font-size:13px; color:var(--text-muted);
  border-bottom:1px solid var(--border); transition:background .3s;
}
#status-bar.error { background:rgba(255,59,85,.08); color:var(--danger); }
#status-bar.ok    { background:rgba(34,211,165,.06); color:var(--checkin-col); }
#status-spinner {
  width:14px; height:14px; flex-shrink:0;
  border:2px solid var(--border); border-top-color:var(--accent);
  border-radius:50%; animation:spin .7s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg); } }

/* ── grid ── */
#grid-container { flex:1; padding:16px 20px; }

@media (min-width:600px) {
  #grid-container {
    display:grid; grid-template-columns:1fr 1fr 1fr;
    gap:12px 20px; align-items:start;
  }
}
@media (max-width:599px) {
  #grid-container {
    display:flex; flex-direction:column; gap:10px;
    -webkit-overflow-scrolling:touch;
  }
}

/* ── day row ── */
.day-row {
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius); overflow:hidden;
  cursor:pointer; transition:border-color .15s, box-shadow .15s;
  user-select:none; -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
}
.day-row:hover     { border-color:var(--accent-dim); box-shadow:0 0 0 1px var(--accent-dim); }
.day-row:active    { opacity:.85; }
.day-row.today-row { border-color:var(--accent); }
.day-row.empty-row { opacity:.4; pointer-events:none; }

/* ── day header ── */
.day-header {
  display:flex; align-items:baseline; gap:8px;
  padding:10px 14px 8px; border-bottom:1px solid var(--border);
}
.day-num   { font-size:22px; font-weight:600; font-family:var(--font-mono); line-height:1; }
.day-name  { font-size:12px; font-weight:500; color:var(--text-muted); text-transform:uppercase; letter-spacing:.08em; }
.day-month { font-size:11px; color:var(--text-dim); font-family:var(--font-mono); margin-left:auto; }
.today-tag {
  font-size:9px; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
  color:var(--accent); background:rgba(61,142,248,.12);
  border:1px solid rgba(61,142,248,.25); padding:1px 6px; border-radius:3px;
}
.empty-day-label { font-size:11px; color:var(--text-dim); padding:10px 14px; font-style:italic; }

/* ── tile tray ── */
.tile-tray {
  display:flex; flex-wrap:wrap; gap:8px;
  padding:10px 14px 12px; -webkit-overflow-scrolling:touch;
}

/* ── property tile ── */
.prop-tile {
  display:flex; align-items:center; gap:7px;
  padding:7px 10px; background:var(--surface2);
  border:1px solid var(--border); border-radius:var(--radius-sm); min-width:80px;
}
.tile-icon-wrap {
  width:30px; height:30px; display:flex; align-items:center; justify-content:center;
  border-radius:6px; background:var(--surface); font-size:17px; flex-shrink:0;
  transition:background .2s;
}
.prop-tile.alert .tile-icon-wrap {
  background:var(--danger);
  animation:flashAlert 1.2s ease-in-out infinite alternate;
}
@keyframes flashAlert {
  from { background:var(--danger); box-shadow:0 0 6px var(--danger-glow); }
  to   { background:#cc1e35;       box-shadow:0 0 14px var(--danger-glow); }
}
.tile-code { font-family:var(--font-mono); font-size:12px; font-weight:600; letter-spacing:.05em; }

/* ── modal ── */
#modal-backdrop {
  display:none; position:fixed; inset:0; z-index:500;
  background:rgba(5,7,15,.8); backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  align-items:center; justify-content:center;
}
#modal-backdrop.open { display:flex; }
#modal {
  background:var(--surface); border:1px solid var(--border); border-radius:14px;
  width:min(480px,calc(100vw - 32px)); max-height:calc(100vh - 80px);
  display:flex; flex-direction:column; overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.7);
}
#modal-header {
  padding:16px 20px 14px; border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:12px;
}
#modal-date-num   { font-size:36px; font-weight:700; font-family:var(--font-mono); line-height:1; }
#modal-date-info  { flex:1; }
#modal-date-label { font-size:14px; font-weight:500; }
#modal-date-month { font-size:11px; color:var(--text-muted); font-family:var(--font-mono); }
#modal-close {
  width:30px; height:30px; border-radius:50%;
  background:var(--surface2); border:1px solid var(--border);
  color:var(--text-muted); font-size:16px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:background .15s, color .15s;
}
#modal-close:hover { background:var(--danger); color:#fff; }
#modal-body {
  overflow-y:auto; flex:1; padding:14px 20px 20px;
  -webkit-overflow-scrolling:touch;
}
.modal-card {
  background:var(--surface2); border:1px solid var(--border);
  border-radius:var(--radius); padding:12px 16px; margin-bottom:10px;
  display:flex; align-items:flex-start; gap:12px;
}
.modal-card.rank-1 { border-left:3px solid var(--danger); }
.modal-card.rank-2 { border-left:3px solid var(--checkout-col); }
.modal-card.rank-3 { border-left:3px solid var(--checkin-col); }
.modal-icon      { font-size:22px; padding-top:2px; }
.modal-info      { flex:1; }
.modal-full-name { font-size:13px; font-weight:500; margin-bottom:6px; }
.modal-tags      { display:flex; gap:6px; flex-wrap:wrap; }
.tag { font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; padding:2px 8px; border-radius:3px; }
.tag-out  { background:rgba(245,158,11,.15); color:var(--checkout-col); border:1px solid rgba(245,158,11,.3); }
.tag-in   { background:rgba(34,211,165,.12); color:var(--checkin-col);  border:1px solid rgba(34,211,165,.25); }
.tag-same { background:rgba(255,59,85,.15);  color:var(--danger);       border:1px solid rgba(255,59,85,.3); }
.modal-empty { text-align:center; color:var(--text-muted); font-size:13px; padding:30px 0; font-style:italic; }

/* ── debug panel ── */
#debug-panel { display:none; }
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="header-brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3d8ef8" stroke-width="1.8">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      <div>
        <div class="header-title">Cleaning Dashboard</div>

    </div>

      <div class="today-label">Today</div>
      <div class="today-date" id="header-today"></div>

    <div id="status-spinner"></div>
    <span id="status-text">Connecting to server…</span>

  <div id="grid-container"></div>
</div>

<!-- modal -->
<div id="modal-backdrop" role="dialog" aria-modal="true">
  <div id="modal">
    <div id="modal-header">
      <div id="modal-date-num">—</div>
      <div id="modal-date-info">
        <div id="modal-date-label">—</div>
        <div id="modal-date-month">—</div>

      <button id="modal-close" aria-label="Close">✕</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<!-- debug panel: shown only when server returns debugMode != 'off' -->
<div id="debug-panel"></div>

<script>
'use strict';

// ── debug ────────────────────────────────────────────────────
var _debugMode = 'off';

function initDebug(mode) {
  _debugMode = mode || 'off';
  if (_debugMode === 'off') return;
  var panel = document.getElementById('debug-panel');
  panel.style.cssText =
    'display:block;position:fixed;bottom:0;left:0;right:0;z-index:9000;' +
    'background:rgba(0,0,0,.93);border-top:1px solid #2a5a2a;' +
    'font-family:monospace;font-size:11px;max-height:200px;overflow-y:auto;' +
    'padding:6px 12px 10px;line-height:1.7;';
  document.getElementById('app').style.paddingBottom = '220px';
  dlog('ok', 'Debug mode: ' + _debugMode + '  |  DEPLOYMENT_URL set: ' + !!window.DEPLOYMENT_URL);
}

function dlog(level, msg, data) {
  if (_debugMode === 'off') return;
  if (_debugMode === 'minimal' && level === 'verbose') return;
  if (data !== undefined) { try { msg += '  →  ' + JSON.stringify(data); } catch(e) {} }
  var colors = { verbose:'#a78bfa', minimal:'#38bdf8', error:'#f87171', warn:'#fbbf24', ok:'#4ade80' };
  var panel = document.getElementById('debug-panel');
  if (!panel) return;
  // Note: toISOString() is intentionally used here for the debug timestamp only (UTC is fine for log timestamps)
  var ts  = new Date().toISOString().slice(11, 23);
  var row = document.createElement('div');
  row.style.cssText = 'display:flex;gap:8px;';
  row.innerHTML =
    '<span style="color:#3d5a3d;flex-shrink:0">' + ts + '</span>' +
    '<span style="color:'+(colors[level]||'#fff')+';flex-shrink:0;font-weight:600">['+level.toUpperCase()+']</span>' +
    '<span style="color:#c8f7c8;word-break:break-all">' + esc(msg) + '</span>';
  panel.appendChild(row);
  panel.scrollTop = panel.scrollHeight;
}

// ── helpers ──────────────────────────────────────────────────

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function pad2(n) { return n < 10 ? '0'+n : ''+n; }

/**
 * Format a local Date as 'YYYYMMDD' for iCal key matching.
 * Uses LOCAL time getters — never toISOString() (which gives UTC).
 */
function dateKey(d) {
  return '' + d.getFullYear() + pad2(d.getMonth()+1) + pad2(d.getDate());
}

/**
 * Format a local Date as a human label e.g. 'Mon 18 May 2026'.
 * Uses LOCAL time getters — never toISOString().
 */
var DAY_NAMES   = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function humanDate(d) {
  return DAY_NAMES[d.getDay()] + ' ' + d.getDate() + ' ' + MONTH_NAMES[d.getMonth()] + ' ' + d.getFullYear();
}

/**
 * Build 14-day window using local Date constructor + setDate arithmetic.
 * Never uses toISOString() — safe across all timezones.
 */
function buildWindow() {
  var dates = [];
  var base  = new Date();
  base.setHours(0, 0, 0, 0);   // local midnight
  for (var i = 0; i < 21; i++) {
    var d = new Date(base.getFullYear(), base.getMonth(), base.getDate() + i);
    dates.push(d);
  }
  return dates;
}

// ── status bar ────────────────────────────────────────────────

function setStatus(type, msg) {
  var bar  = document.getElementById('status-bar');
  var text = document.getElementById('status-text');
  var spin = document.getElementById('status-spinner');
  text.textContent   = msg;
  bar.className      = type;
  spin.style.display = (type === '') ? 'block' : 'none';
  dlog(type === 'error' ? 'error' : 'ok', 'Status: ' + msg);
}

// ── API transport (JSONP) ─────────────────────────────────────

/**
 * JSONP GET request to the GAS API.
 * Uses a <script> tag — never subject to CORS.
 * Required because fetch() from a static host to script.google.com
 * triggers a CORS preflight GAS cannot satisfy.
 */
function jsonp(url) {
  return new Promise(function(resolve, reject) {
    var callbackName = 'cb_' + Math.random().toString(36).slice(2);
    var script  = document.createElement('script');
    var timeout = setTimeout(function() {
      cleanup();
      reject(new Error('JSONP timeout after 15s'));
    }, 15000);

    function cleanup() {
      clearTimeout(timeout);
      delete window[callbackName];
      if (script.parentNode) script.parentNode.removeChild(script);
    }

    window[callbackName] = function(data) { cleanup(); resolve(data); };
    script.onerror = function() { cleanup(); reject(new Error('JSONP script load error')); };
    script.src = url + '&callback=' + callbackName;
    dlog('verbose', '[JSONP] GET: ' + script.src.substring(0, 100) + '…');
    document.head.appendChild(script);
  });
}

function apiCall(action, params) {
  if (!window.DEPLOYMENT_URL) {
    return Promise.reject(new Error('window.DEPLOYMENT_URL not set'));
  }
  var url = window.DEPLOYMENT_URL + '?action=' + encodeURIComponent(action);
  if (params) {
    Object.keys(params).forEach(function(k) {
      url += '&' + encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
    });
  }
  dlog('minimal', '[API] JSONP GET: action=' + action);
  return jsonp(url);
}

// ── iCal parser ──────────────────────────────────────────────

/**
 * Parse normalised iCal text (CRLF already cleaned by server)
 * into {checkouts, checkins} sets of YYYYMMDD keys.
 *
 * Handles all Airbnb DTSTART/DTEND variants:
 *   VALUE=DATE:20260518             → date-only, use directly
 *   TZID=America/Denver:20260518T110000  → floating local, use date portion
 *   :20260518T050000Z               → UTC datetime, convert to local date
 *
 * Uses /^DTSTART[;:]/ regex — NOT startsWith('DTSTART:')
 * so VALUE=DATE and TZID= variants are both caught.
 */
function parseIcal(text, shortCode) {
  var checkouts = new Set(), checkins = new Set();
  if (!text) { dlog('warn', '['+shortCode+'] empty iCal'); return { checkouts: checkouts, checkins: checkins }; }

  // Server already normalised CRLF→LF and unfolded lines
  var lines    = text.split('\n');
  var inEvent  = false;
  var startKey = null, endKey = null;

  lines.forEach(function(rawLine) {
    var line = rawLine.trim();

    if (line === 'BEGIN:VEVENT') {
      inEvent = true; startKey = null; endKey = null;
      return;
    }
    if (line === 'END:VEVENT') {
      inEvent = false;
      if (startKey) checkins.add(startKey);
      if (endKey)   checkouts.add(endKey);
      return;
    }
    if (!inEvent) return;

    // Match DTSTART or DTEND with any parameters: VALUE=DATE, TZID=..., or bare
    if (/^DTSTART[;:]/.test(line) || /^DTEND[;:]/.test(line)) {
      var isStart  = line.charAt(2) === 'S';   // DTSTART vs DTEND
      var rawValue = line.split(':').slice(1).join(':').trim();

      // Normalise: strip time portion, strip dashes → YYYYMMDD
      var datePart = rawValue.replace(/T.*$/, '').replace(/-/g, '');

      var key;
      // UTC datetime (ends with Z before we stripped T...)
      if (/T\d{6}Z$/.test(rawValue)) {
        // Convert UTC to local date to avoid midnight boundary flip
        var localDate = new Date(Date.UTC(
          parseInt(datePart.slice(0,4), 10),
          parseInt(datePart.slice(4,6), 10) - 1,
          parseInt(datePart.slice(6,8), 10),
          parseInt(rawValue.slice(9,11), 10),
          parseInt(rawValue.slice(11,13), 10),
          parseInt(rawValue.slice(13,15), 10)
        ));
        key = dateKey(localDate);
        dlog('verbose', '['+shortCode+'] UTC '+rawValue+' → local key '+key);
      } else {
        // DATE-only or floating local datetime — use date portion as-is
        key = datePart;
      }

      if (isStart) startKey = key;
      else         endKey   = key;
    }
  });

  dlog('minimal', '['+shortCode+'] check-ins:'+checkins.size+' check-outs:'+checkouts.size);
  return { checkouts: checkouts, checkins: checkins };
}

// ── grid renderer ────────────────────────────────────────────

var _modalData = {};

function renderGrid(properties, calendarMap, dates) {
  dlog('minimal', 'renderGrid() properties:' + properties.length + ' dates:' + dates.length);
  var grid = document.getElementById('grid-container');
  grid.innerHTML = '';
  _modalData = {};

  dates.forEach(function(date, idx) {
    var key     = dateKey(date);
    var isToday = (idx === 0);

    // Main view tiles: only properties with a checkout
    var tiles = [];
    properties.forEach(function(prop) {
      var cal = calendarMap[prop.shortCode] || {};
      var out = !!(cal.checkouts && cal.checkouts.has(key));
      var inn = !!(cal.checkins  && cal.checkins.has(key));
      if (out) tiles.push({ shortCode: prop.shortCode, icon: prop.icon || '🏠', isTurnover: out && inn });
      dlog('verbose', '['+key+']['+prop.shortCode+'] out:'+out+' in:'+inn);
    });

    // Modal cards: properties with checkout OR checkin
    var cards = [];
    properties.forEach(function(prop) {
      var cal = calendarMap[prop.shortCode] || {};
      var out = !!(cal.checkouts && cal.checkouts.has(key));
      var inn = !!(cal.checkins  && cal.checkins.has(key));
      if (out || inn) cards.push({
        shortCode: prop.shortCode, icon: prop.icon || '🏠',
        fullName: prop.fullName, hasOut: out, hasIn: inn,
        rank: (out && inn) ? 1 : out ? 2 : 3
      });
    });
    cards.sort(function(a, b) { return a.rank - b.rank; });
    _modalData[key] = { date: date, cards: cards };

    // Build DOM
    var row   = document.createElement('div');
    var empty = (tiles.length === 0);
    row.className   = 'day-row' + (isToday ? ' today-row' : '') + (empty ? ' empty-row' : '');
    row.dataset.key = key;

    var hdr =
      '<div class="day-header">' +
      '<div class="day-num">'  + date.getDate() + '</div>' +
      '<div class="day-name">' + DAY_NAMES[date.getDay()] + '</div>' +
      (isToday ? '<span class="today-tag">Today</span>' : '') +
      '<div class="day-month">' + MONTH_NAMES[date.getMonth()] + '</div>' +
      '</div>';

    var body = empty
      ? '<div class="empty-day-label">No checkouts</div>'
      : '<div class="tile-tray">' + tiles.map(function(t) {
          return '<div class="prop-tile' + (t.isTurnover ? ' alert' : '') + '">' +
                 '<div class="tile-icon-wrap">' + t.icon + '</div>' +
                 '<div class="tile-code">'      + esc(t.shortCode) + '</div>' +
                 '</div>';
        }).join('') + '</div>';

    row.innerHTML = hdr + body;

    if (!empty) {
      row.addEventListener('click', function() { openModal(key); });
      row.addEventListener('touchend', function(e) {
        e.preventDefault();
        openModal(key);
      }, { passive: false });
    }
    grid.appendChild(row);
  });

  dlog('minimal', 'Grid rendered.');
}

// ── modal ────────────────────────────────────────────────────

function openModal(key) {
  var data = _modalData[key];
  if (!data) return;
  dlog('verbose', 'Modal open: ' + key);
  var d = data.date;
  document.getElementById('modal-date-num').textContent   = d.getDate();
  document.getElementById('modal-date-label').textContent = DAY_NAMES[d.getDay()];
  document.getElementById('modal-date-month').textContent = MONTH_NAMES[d.getMonth()] + ' ' + d.getFullYear();

  var body = document.getElementById('modal-body');
  body.innerHTML = '';

  if (!data.cards.length) {
    body.innerHTML = '<div class="modal-empty">Nothing to do on this day.</div>';
  } else {
    data.cards.forEach(function(c) {
      var tags = '';
      if (c.hasOut && c.hasIn) tags = '<span class="tag tag-same">⚡ Same-Day Turnover</span><span class="tag tag-out">Check-Out</span><span class="tag tag-in">Check-In</span>';
      else if (c.hasOut)       tags = '<span class="tag tag-out">Check-Out</span>';
      else                     tags = '<span class="tag tag-in">Check-In</span>';
      body.innerHTML +=
        '<div class="modal-card rank-' + c.rank + '">' +
        '<div class="modal-icon">' + c.icon + '</div>' +
        '<div class="modal-info">' +
        '<div class="modal-full-name">' + esc(c.fullName) + '</div>' +
        '<div class="modal-tags">'      + tags            + '</div>' +
        '</div></div>';
    });
  }
  document.getElementById('modal-backdrop').classList.add('open');
}

function closeModal() {
  document.getElementById('modal-backdrop').classList.remove('open');
}
document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('modal-backdrop').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal(); });

// ── bootstrap ────────────────────────────────────────────────

(function init() {
  // Header date — local getters only, never toISOString()
  var today = new Date();
  document.getElementById('header-today').textContent = humanDate(today);

  var dates = buildWindow();
  setStatus('', 'Connecting to server…');

  var t0 = Date.now();

  apiCall('cleaning_data')
    .then(function(data) {
      dlog('minimal', 'API response in ' + (Date.now()-t0) + ' ms  server elapsed=' + data.elapsed + ' ms');
      dlog('verbose', 'Full response', data);

      // Mirror server debug mode now that we have the response
      initDebug(data.debugMode || 'off');

      // Sanity-check: log server's local today vs client's
      dlog('minimal', 'Server today: ' + data.today + '  Client today: ' + dateKey(today));

      if (!data.ok) {
        setStatus('error', 'Server error: ' + (data.error || 'unknown'));
        return;
      }

      dlog('minimal', 'Properties: ' + data.properties.length + '  iCal results: ' + (data.icalData||[]).length);

      // Parse iCal text client-side (server already normalised line endings)
      var calendarMap = {};
      (data.icalData || []).forEach(function(r) {
        if (r.error) dlog('error', '['+r.shortCode+'] server fetch error: '+r.error);
        calendarMap[r.shortCode] = parseIcal(r.icalText, r.shortCode);
      });

      setStatus('ok',
        'Dashboard ready  ·  ' + data.properties.length +
        ' properties  ·  ' + data.elapsed + ' ms  ·  tz: ' + (data.timezone || '?')
      );
      renderGrid(data.properties, calendarMap, dates);
    })
    .catch(function(err) {
      setStatus('error', 'Failed to load: ' + err.message);
      dlog('error', 'apiCall() failed: ' + err.message);
    });
})();
</script>
</body>
