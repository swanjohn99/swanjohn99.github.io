<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>List of Attractions and their GPS coordinates</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{
    --bg:#10231b; --panel:#16302541; --line:rgba(255,255,255,.1);
    --ink:#f4efe6; --muted:#9fb4a8; --accent:#c97c3a; --sage:#7aab8a;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'DM Sans',system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;overflow:hidden}
  #top-bar{flex-shrink:0;background:#0a1812;border-bottom:1px solid var(--line);padding:12px 18px}
  .filter-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
  .filter-row:last-child{margin-bottom:0}
  .filter-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-right:4px;flex-shrink:0}
  .filter-btns{display:flex;flex-wrap:wrap;gap:8px}
  .filter-btn{padding:8px 16px;border-radius:20px;border:1px solid var(--line);background:rgba(255,255,255,.05);
    color:var(--ink);font-size:.85rem;cursor:pointer;transition:background .15s,border-color .15s,color .15s}
  .filter-btn:hover{background:rgba(122,171,138,.15)}
  .filter-btn.cabin.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .filter-btn.layer.active{background:var(--sage);border-color:var(--sage);color:#10231b}
  #app{display:flex;flex:1;min-height:0;overflow:hidden}

  #sidebar{width:360px;flex-shrink:0;display:flex;flex-direction:column;background:#0d1d16;border-right:1px solid var(--line)}
  #sidebar header{padding:22px 22px 16px;border-bottom:1px solid var(--line)}
  #sidebar h1{font-family:'Playfair Display',Georgia,serif;font-size:1.45rem;font-weight:700;line-height:1.2}
  #sidebar .sub{margin-top:6px;color:var(--muted);font-size:.82rem}
  .search{padding:14px 18px;border-bottom:1px solid var(--line)}
  .search input{width:100%;padding:10px 14px;border-radius:10px;border:1px solid var(--line);
    background:rgba(255,255,255,.06);color:var(--ink);font-size:.9rem;outline:none}
  .search input::placeholder{color:rgba(255,255,255,.35)}

  #list{overflow-y:auto;flex:1}
  .item{display:flex;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s}
  .item:hover,.item.active{background:rgba(122,171,138,.12)}
  .thumb{width:64px;height:64px;border-radius:10px;object-fit:cover;flex-shrink:0;background:rgba(255,255,255,.05)}
  .thumb.empty{display:flex;align-items:center;justify-content:center;font-size:1.4rem;color:var(--muted)}
  .item .meta{min-width:0}
  .item .nm{font-weight:600;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .cat{color:var(--sage);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
  .item .ex{color:var(--muted);font-size:.8rem;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

  #map{flex:1}
  .leaflet-popup-content{margin:0;width:240px!important}
  .pop img{width:100%;height:140px;object-fit:cover;display:block;border-radius:8px 8px 0 0}
  .pop .pad{padding:10px 12px 12px}
  .pop h3{font-size:1rem;margin-bottom:4px;color:#1e3a2f}
  .pop .pcat{color:#3d6b54;font-size:.68rem;text-transform:uppercase;letter-spacing:.05em}
  .pop p{font-size:.82rem;color:#36433c;margin-top:6px;max-height:84px;overflow:auto}
  .pop button{margin-top:10px;background:var(--accent);color:#fff;border:none;border-radius:20px;
    padding:7px 16px;font-size:.8rem;cursor:pointer}

  #modal{position:fixed;inset:0;background:rgba(8,16,12,.9);display:none;align-items:center;justify-content:center;z-index:9999;padding:20px}
  #modal.show{display:flex}
  .card{background:#13271e;border:1px solid var(--line);border-radius:16px;max-width:760px;width:100%;max-height:90vh;overflow:auto}
  .card .gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px;padding:6px}
  .card .gal img{width:100%;height:140px;object-fit:cover;border-radius:8px;cursor:zoom-in}
  .card .body{padding:18px 22px 24px}
  .card h2{font-family:'Playfair Display',Georgia,serif;font-size:1.6rem}
  .card .mcat{color:var(--sage);font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
  .card .desc{margin-top:14px;color:#d9e4dd;line-height:1.65;white-space:pre-wrap;font-size:.95rem}
  .card .close{float:right;background:none;border:none;color:var(--muted);font-size:1.6rem;cursor:pointer;line-height:1}

  #lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:10000;cursor:zoom-out}
  #lightbox.show{display:flex}
  #lightbox img{max-width:94vw;max-height:94vh;border-radius:8px}

  .mobile-toggle{display:none}
  @media(max-width:760px){
    #top-bar{padding:10px 12px}
    .filter-label{width:100%;margin-bottom:2px}
    #app{flex-direction:column}
    #sidebar{width:100%;height:auto;max-height:40vh}
    #map{flex:1;min-height:45vh}
  }
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500&display=swap');
</style>
</head>
<body>
<div id="top-bar">
  <div class="filter-row" id="cabin-row" style="display:none">
    <span class="filter-label">Cabin location</span>
    <div class="filter-btns" id="cabin-btns"></div>
  </div>
  <div class="filter-row" id="layer-row" style="display:none">
    <span class="filter-label">Layers</span>
    <div class="filter-btns" id="layer-btns"></div>
  </div>
</div>
<div id="app">
  <aside id="sidebar">
    <header>
      <h1>List of Attractions and their GPS coordinates</h1>
      <div class="sub" id="count"></div>
    </header>
    <div class="search"><input id="q" type="text" placeholder="Search places…" /></div>
    <div id="list"></div>
  </aside>
  <div id="map"></div>
</div>

<div id="modal"><div class="card">
  <div class="body">
    <button class="close" onclick="closeModal()">×</button>
    <h2 id="m-name"></h2>
    <div class="mcat" id="m-cat"></div>
    <div class="gal" id="m-gal"></div>
    <div class="desc" id="m-desc"></div>
  </div>
</div></div>

<div id="lightbox" onclick="this.classList.remove('show')"><img id="lb-img" alt="" /></div>

<script>
var PLACES = [{"name":"**Katerskill Falls parking 1 - wheelchair accessible**","description":"Laurel House parking. Pros: 1) Wheelchair OK  2) Super short hike to the top of the falls viewing platform Cons:  Very hard/impossible to find parking, On busy days, cops won't even let you get close. Be there before 10.. Earlier the better  or Go to the historical society parking lot instead. Kaaterskill trolly is always a good option.","lat":42.1956523,"lng":-74.0630392,"category":"adventure","images":["place_0_0.png"]},{"name":"**Kaaterskill falls parking 2 WheelChair**Old train station 1.5 mile *easy park*","description":"Easy to find parking to Katerskill falls. 1.5 miles to the actual viewing platform","lat":42.1947172,"lng":-74.0924515,"category":"adventure","images":[]},{"name":"*Kaaterskill falls parking 3** a bit too far","description":"Once you park here, its a nice long hike to the falls (did I say long?) North Point and Badman's Cave Loop  5.6 mile lightly trafficked loop trail.","lat":42.2010463,"lng":-74.0580714,"category":"adventure","images":["place_2_0.png","place_2_1.png","place_2_2.png"]},{"name":"**My favorite**Overlook Fire Tower","description":"Why my favorite? Super close to 1.Woodstock, 2. Overlook mountain House ruins and 3 KTD tibetal monestary. You can combine all three into one trip.","lat":42.085045,"lng":-74.0934028,"category":"adventure","images":["place_3_0.png"]},{"name":"Buy Firewood locally!","description":"1. Stewart Gas stations  2.Some Dollar generals 3.ALL Walmarts  4.If you see \"campwood\" sign, they are sold by local households and are cheaper","lat":42.083984,"lng":-73.9716,"category":"adventure","images":[]},{"name":"Highest fire tower in NY!","description":"Directions: Take the Spruceton Trail, marked with blue disks, from Greene County Route 6 (Spruceton Hollow Road) in the hamlet of Spruceton. A seven-mile moderately-difficult round trip hike. Or take the yellow-marked trail from the Hunter Mt. Sky Ride when it is open-a moderate four-mile round-trip hike.   This tower has the unique distinction of being located at the highest elevation of any fire tower in New York State. The original tower on Hunter Mountain-constructed of logs-was built in 1909, and was the first of three fire towers constructed in the Catskills that year. The original tower was 40 feet tall, and was replaced with a steel tower 60 feet high in 1917. That tower was originally placed at an elevation of 4,000 feet-a third of a mile from the true summit-but was removed and reset at its present site on the true summit in 1953.","lat":42.1918638,"lng":-74.325049,"category":"adventure","images":["place_5_0.png"]},{"name":"Zoom Flume Water Park","description":"","lat":42.3792924,"lng":-74.1451661,"category":"adventure","images":[]},{"name":"Devil's Path Trail","description":"","lat":42.1339443,"lng":-74.1044684,"category":"adventure","images":[]},{"name":"Horseback Riding","description":"","lat":42.216451,"lng":-74.0063951,"category":"adventure","images":[]},{"name":"Palenville Overlook","description":"Walking distance from Palenville","lat":42.18121,"lng":-74.0363368,"category":"adventure","images":["place_9_0.png"]},{"name":"Catskill Mountain Railroad","description":"$15 ticket takes you through mountain, bridges and farmland","lat":41.9354088,"lng":-74.0153554,"category":"adventure","images":["place_10_0.png","place_10_1.png","place_10_2.png"]},{"name":"Human powered train!","description":"","lat":42.0801662,"lng":-74.3080429,"category":"adventure","images":["place_11_0.png","place_11_1.png"]},{"name":"First fire tower in NY","description":"Directions to the tower: Follow the blue-marked Dry Brook Ridge Trail located on Mill Brook Road outside the hamlet of Arkville. This is a moderate, six-mile round-trip hike.  Balsam Lake Mountain fire tower, open Memorial Day through Columbus Day, is the first forest fire tower in New York State and was erected on Balsam Lake Mountain (elevation 3,723 ft.) in 1887. Built of wood by the Balsam Lake Club, it survived until 1901 and was replaced with another wooden tower in 1905. Telephone lines, a small observer's cabin and a road to the summit were added in 1909 when the state took it over. The first steel tower was erected in 1919, and the present steel tower (47 feet tall) was built in 1930.","lat":42.0703929,"lng":-74.5737779,"category":"adventure","images":["place_12_0.png"]},{"name":"Fishing - Colgate Lake","description":"","lat":42.235693,"lng":-74.1203256,"category":"adventure","images":[]},{"name":"Kaaterskill trolly-- best thing ever!","description":"Checkout Kaaterskilltrolley.com .Take the trolley rright from palenville and avoid all the parking hassles. It will take u to all the attractions all the way to Hunter","lat":42.1940864,"lng":-74.0899754,"category":"adventure","images":[]},{"name":"High Falls Conservation Area","description":"","lat":42.2471274,"lng":-73.6575053,"category":"adventure","images":[]},{"name":"*Kaaterskill Falls - Must have photos - platform, top, middle","description":"1) View the Entire falls from this platform \n2) **Danger!! Danger! Walk to the top of the falls  3) Walk 30 mins to the Middle falls and go to the cave behind the falls","lat":42.1938333,"lng":-74.0636208,"category":"adventure","images":["place_16_0.png","place_16_1.png","place_16_2.png"]},{"name":"*Hudson*Upper Depot Brewing","description":"","lat":42.2484436,"lng":-73.7813949,"category":"Nightlife/Restaurants/Farmers market","images":["place_17_0.png"]},{"name":"*Saugerties -Drink with waterfall view*Diamond Mills Hotel","description":"","lat":42.0727778,"lng":-73.9502778,"category":"Nightlife/Restaurants/Farmers market","images":["place_18_0.png"]},{"name":"Hudson*My favorite bar in Hudson","description":"Open late, live music, outdoor seating","lat":42.2516114,"lng":-73.7897638,"category":"Nightlife/Restaurants/Farmers market","images":[]},{"name":"**My favorite food place **The Pantry On Main","description":"","lat":42.196083,"lng":-74.134," urants/Farmers market","images":[]},{"name":"Tousey Winery","description":"","lat":42.085529,"lng":-73.825777,"category":"Nightlife/Restaurants/Farmers market","images":[]},{"name":"Vinnie's Farm Market","description":"smoked fish, baked goods, veggies, honey, flowers-- more selection than story farm","lat":42.1356023,"lng":-74.0009877,"category":"Nightlife/Restaurants/Farmers market","images":[]},{"name":"Dog friendly places","description":"Miost places used to be Dog friendly. The health department is cracking down on allowing dogs inside. The restaurants are responding by creating outdoor spaces for dogs. This changes all the time so, it is best to call the restaurants.","lat":42.1590368,"lng":-73.8858673,"category":"Dog friendly places","images":[]},{"name":"**sometimes closed, ask locals**Marble rock probably the best swimming hole in New York","description":"The owners periodically close this place. WhileA natural spa, full of cascades and small pools and a large lake . Jump into the warm water from the cliffs. 1) Go to \"INN AT LEEDS\" 2) Go all the way to the back until you see the Dumpsters. Park there. 3) Walk STRAIGHT, Going past the electrical panel and generator until you see Water.","lat":42.2543884,"lng":-73.9016593,"category":"Swimming / Lakes /beaches/ Cliff Jumps","images":["place_41_0.png","place_41_1.png"]},{"name":"40 ft cliff jump Fawn's Leap","description":"High adrenaline 40 foot jump  . **Illegally parked cars towed**. 1) Use Kaaterskill trolly 2) Park at Harding road trailhead, Palenville 3)Uber/Hitchhike 4) Try your luck for the 6 available parking spots along the way","lat":42.1773253,"lng":-74.057276,"category":"Swimming / Lakes /beaches/ Cliff Jumps","images":["place_42_0.png","place_42_1.png","place_42_2.jpg"]},{"name":"Peekamoose Blue Hole","description":"https://www.dec.ny.gov/lands/109922.html","lat":41.9164326,"lng":-74.4250903,"category":"Swimming / Lakes /beaches/ Cliff Jumps","images":["place_43_0.png"]},{"name":"Rats hole..illegally parked cars towed","description":"**Illegally parked cars towed**. 1) Use Kaaterskill trolly 2) Park at Harding road trailhead, Palenville 3)Uber/Hitchhike 4) Try your luck for the 6 available parking spots along the way","lat":42.1768945,"lng":-74.0452663,"category":"Swimming / Lakes /beaches/ Cliff Jumps","images":[]},{"name":"North-South Lake -Cute beach-Fishing Boat rental","description":"","lat":42.199131,"lng":-74.041072,"category":"Swimming / Lakes /beaches/ Cliff Jumps","images":["place_45_0.png"]},{"name":"**walk/bike**city is trying to restrict access because of trash problem","description":"but its super close, and go and check whats up","lat":42.1698515,"lng":-74.0164531,"category":"Swimming / Lakes /beaches/ Cliff Jumps","images":["place_46_0.png"]},{"name":"Lake Taghkanic State Park","description":"","lat":42.0908988,"lng":-73.7182607,"category":"Swimming / Lakes /beaches/ Cliff Jumps","images":[]},{"name":"Big Deep**town owed, but may be closed because of trash left by people**","description":"BIG DEEP, WOODSTOCK\n\nThis is a popular swimming area, with a pretty jade lagoon surrounded by forest. The parking area is just a road side pull off, and Casablanca Lane is very close to it, so you can keep an eye out for that. Once you park, you follow a well worn trail down to the water.\n\nThere is a rope swing and a small upper area as well. The water seems to be about 4ft. deep. We were there during a cloudy day, but the water is a brilliant turquoise in the sunlight.  Casablanca Lane is a private road, with no public access to the swimming area. Please use the lane as a landmark only, and do not drive down this road. The entrance to the parking area is east of Casablanca Lane.","lat":42.0359278,"lng":-74.0977972,"category":"Swimming / Lakes /beaches/ Cliff Jumps","images":["place_48_0.png"]},{"name":"MILLSTREAM, WOODSTOCK**Private property, closed due to recent trash problem**","description":"Example of why we can't have nice things. The owners had var CABINS = [{"name":"Palenville","address":"95 Pine avenue","lat":null,"lng":null},{"name":"Leeds","address":"51 Gypsy Point Road","lat":null,"lng":null}];
var LAYERS = ["adventure","art installations","Dog friendly places","instagram !!","Monasteries/ Retreats","Nightlife/Restaurants/Farmers market","Safer and longer route to Hunter/windham ski- better views","scenic bike ride/ car ride","Scenic route to hunter mountain from palenville","Swimming / Lakes /beaches/ Cliff Jumps"];
var IMG_BASE = "images/";
var selectedCabin = 0;
var selectedLayer = null;

delete L.Icon.Default.prototype._getIconUrl;
L.Icon.Default.mergeOptions({
  iconRetinaUrl:"https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon-2x.png",
  iconUrl:"https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png",
  shadowUrl:"https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png"
});

var map = L.map("map",{scrollWheelZoom:true});
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
  maxZoom:19, attribution:"&copy; OpenStreetMap contributors"
}).addTo(map);

function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function imgUrl(f){return IMG_BASE+f;}

var markers=[], bounds=[];
PLACES.forEach(function(p,i){
  var m=L.marker([p.lat,p.lng]).addTo(map);
  m.bindPopup(popupHtml(p,i),{maxWidth:260});
  m.on("popupopen",function(){var b=document.getElementById("more-"+i);if(b)b.onclick=function(){openModal(i);};});
  markers.push(m); bounds.push([p.lat,p.lng]);
});
if(bounds.length) map.fitBounds(bounds,{padding:[40,40]}); else map.setView([20,0],2);

function popupHtml(p,i){
  var img=(p.images&&p.images.length)?'<img src="'+esc(imgUrl(p.images[0]))+'" alt="">':"";
  var cat=p.category?'<div class="pcat">'+esc(p.category)+'</div>':"";
  var d=p.description?'<p>'+esc(p.description).replace(/\n/g,"<br>")+'</p>':"";
  return '<div class="pop">'+img+'<div class="pad">'+cat+'<h3>'+esc(p.name)+'</h3>'+d+
         '<button id="more-'+i+'">View details</button></div></div>';
}

function distKm(lat1,lng1,lat2,lng2){
  var R=6371, dLat=(lat2-lat1)*Math.PI/180, dLng=(lng2-lng1)*Math.PI/180;
  var a=Math.sin(dLat/2)*Math.sin(dLat/2)+
    Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function placeDistance(p){
  if(!CABINS.length||selectedCabin<0||selectedCabin>=CABINS.length) return Infinity;
  var c=CABINS[selectedCabin];
  if(c.lat==null||c.lng==null) return Infinity;
  return distKm(c.lat,c.lng,p.lat,p.lng);
}

function layerRank(category){
  var cat=(category||"").trim();
  if(!cat) return LAYERS.length+1;
  if(!selectedLayer){
    var idx=LAYERS.indexOf(cat);
    return idx>=0?idx:LAYERS.length;
  }
  if(cat===selectedLayer) return 0;
  var others=LAYERS.filter(function(l){return l!==selectedLayer;});
  var pos=others.indexOf(cat);
  return pos>=0?pos+1:others.length+1;
}

function sortedPlaces(filter){
  filter=(filter||"").toLowerCase();
  var items=[];
  PLACES.forEach(function(p,i){
    var hay=(p.name+" "+p.category+" "+p.description).toLowerCase();
    if(filter && hay.indexOf(filter)<0) return;
    items.push({p:p,i:i,d:placeDistance(p),lr:layerRank(p.category)});
  });
  items.sort(function(a,b){
    if(a.lr!==b.lr) return a.lr-b.lr;
    if(a.d!==b.d) return a.d-b.d;
    return a.p.name.localeCompare(b.p.name);
  });
  return items;
}

function initFilters(){
  var cabinRow=document.getElementById("cabin-row");
  var layerRow=document.getElementById("layer-row");
  var cabinBtns=document.getElementById("cabin-btns");
  var layerBtns=document.getElementById("layer-btns");
  cabinBtns.innerHTML=""; layerBtns.innerHTML="";

  if(CABINS.length){
    cabinRow.style.display="flex";
    CABINS.forEach(function(c,idx){
      var btn=document.createElement("button");
      btn.type="button";
      btn.className="filter-btn cabin"+(idx===selectedCabin?" active":"");
      btn.textContent=c.name;
      btn.onclick=function(){
        selectedCabin=idx;
        cabinBtns.querySelectorAll(".filter-btn").forEach(function(b,j){
          b.classList.toggle("active",j===selectedCabin);
        });
        renderList(document.getElementById("q").value);
      };
      cabinBtns.appendChild(btn);
    });
  } else {
    cabinRow.style.display="none";
  }

  if(LAYERS.length){
    layerRow.style.display="flex";
    LAYERS.forEach(function(layer){
      var btn=document.createElement("button");
      btn.type="button";
      btn.className="filter-btn layer";
      btn.textContent=layer;
      btn.setAttribute("data-layer",layer);
      btn.onclick=function(){
        selectedLayer=(selectedLayer===layer)?null:layer;
        layerBtns.querySelectorAll(".filter-btn").forEach(function(b){
          b.classList.toggle("active",b.getAttribute("data-layer")===selectedLayer);
        });
        renderList(document.getElementById("q").value);
      };
      layerBtns.appendChild(btn);
    });
  } else {
    layerRow.style.display="none";
  }
}

var listEl=document.getElementById("list");
function renderList(filter){
  listEl.innerHTML="";
  var items=sortedPlaces(filter);
  items.forEach(function(item){
    var p=item.p, i=item.i;
    var t=(p.images&&p.images.length)
      ? '<img class="thumb" src="'+esc(imgUrl(p.images[0]))+'" alt="">'
      : '<div class="thumb empty">📍</div>';
    var ex=p.description?'<div class="ex">'+esc(p.description)+'</div>':"";
    var cat=p.category?'<div class="cat">'+esc(p.category)+'</div>':"";
    var div=document.createElement("div");
    div.className="item"; div.setAttribute("data-i",i);
    div.innerHTML=t+'<div class="meta"><div class="nm">'+esc(p.name)+'</div>'+cat+ex+'</div>';
    div.onclick=function(){focusPlace(i);};
    listEl.appendChild(div);
  });
  document.getElementById("count").textContent=items.length+" place"+(items.length===1?"":"s");
}

function focusPlace(i){
  var p=PLACES[i];
  map.flyTo([p.lat,p.lng],Math.max(map.getZoom(),14),{duration:.6});
  markers[i].openPopup();
  document.querySelectorAll(".item").forEach(function(el){
    el.classList.toggle("active", el.getAttribute("data-i")==String(i));
  });
}

function openModal(i){
  var p=PLACES[i];
  document.getElementById("m-name").textContent=p.name;
  document.getElementById("m-cat").textContent=p.category||"";
  document.getElementById("m-desc").textContent=p.description||"";
  var gal=document.getElementById("m-gal"); gal.innerHTML="";
  (p.images||[]).forEach(function(f){
    var im=document.createElement("img");
    im.src=imgUrl(f); im.alt=p.name;
    im.onclick=function(){var lb=document.getElementById("lb-img");lb.src=im.src;document.getElementById("lightbox").classList.add("show");};
    gal.appendChild(im);
  });
  document.getElementById("modal").classList.add("show");
}
function closeModal(){document.getElementById("modal").classList.remove("show");}
document.getElementById("modal").addEventListener("click",function(e){if(e.target===this)closeModal();});
document.addEventListener("keydown",function(e){if(e.key==="Escape"){closeModal();document.getElementById("lightbox").classList.remove("show");}});

document.getElementById("q").addEventListener("input",function(){renderList(this.value);});
initFilters();
renderList("");
</script>
</body>
</html>
